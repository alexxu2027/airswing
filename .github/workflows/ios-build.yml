name: iOS build

# Runs the unit tests on a simulator, then builds an unsigned AirSwing.ipa on a GitHub-hosted Mac.
# Download it from the run's Artifacts section and sign/install it with Sideloadly.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project AirSwing.xcodeproj \
            -scheme AirSwing \
            -destination "id=$UDID" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild build \
            -project AirSwing.xcodeproj \
            -scheme AirSwing \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AirSwing.app Payload/
          zip -qr AirSwing.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AirSwing-ipa
          path: AirSwing.ipa
          retention-days: 30
