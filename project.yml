# XcodeGen spec. CI runs `xcodegen generate` to produce AirSwing.xcodeproj,
# so no Mac or hand-edited Xcode project is needed.
name: AirSwing
options:
  bundleIdPrefix: com.alexxu2027
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AirSwing:
    type: application
    platform: iOS
    sources:
      - ios/AirSwing
    info:
      path: ios/AirSwing/Info.plist
      properties:
        CFBundleDisplayName: AirSwing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMotionUsageDescription: AirSwing reads AirPods motion to measure your practice swings.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexxu2027.airswing
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - AirSwingTests
  AirSwingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/AirSwingTests
        excludes:
          - "Fixtures/**"
      # Real recordings for ReplayFixtureTests, copied into the bundle as one folder.
      - path: ios/AirSwingTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: AirSwing
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
