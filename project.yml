# XcodeGen spec. CI runs `xcodegen generate` to produce AirSwing.xcodeproj,
# so no Mac or hand-edited Xcode project is needed.
name: AirSwing
options:
  bundleIdPrefix: com.alexxu2027
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AirSwingProbe:
    type: application
    platform: iOS
    sources:
      - ios/AirSwingProbe
    info:
      path: ios/AirSwingProbe/Info.plist
      properties:
        CFBundleDisplayName: AirSwing Probe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMotionUsageDescription: AirSwing Probe reads AirPods motion to test whether a handheld earbud can track practice swings.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexxu2027.airswing.probe
        TARGETED_DEVICE_FAMILY: "1"
